<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PCAT Admin-Anmeldung</title>
  <desc id="desc">Darstellung des Admin-Anmeldebereichs von PCAT mit Feldern für Benutzername und Passwort.</desc>
  <rect width="1280" height="720" fill="#f3f4f6"/>
  <rect x="0" y="0" width="1280" height="5" fill="#172554"/>
  <rect x="380" y="155" width="520" height="410" rx="12" fill="#ffffff"/>
  <rect x="380" y="155" width="520" height="410" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <text x="640" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#172554">Autorenmargen – Admin</text>
  <text x="430" y="278" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">Benutzername</text>
  <rect x="430" y="292" width="420" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="430" y="382" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2937">Passwort</text>
  <rect x="430" y="396" width="420" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="430" y="480" width="140" height="48" rx="6" fill="#1d4ed8"/>
  <text x="500" y="511" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#ffffff">Anmelden</text>
</svg>
